# Pages CMS config — admin panel at https://app.pagescms.org (log in with GitHub, pick this repo).
# Everything lives in this repository: data/shards.json, data/cases.json and the assets/ folder.

media:
  - name: pics
    label: Shards (works)
    input: assets/pics
    output: /assets/pics
  - name: cases
    label: Cases
    input: assets/cases
    output: /assets/cases

content:
  - name: shards
    label: Shards (works)
    type: file
    path: data/shards.json
    format: json
    list: true
    fields:
      - name: image
        label: Picture or video (jpg / png / webp / gif / webm / mp4)
        type: file
        required: true
        options:
          media: pics
          extensions: [jpg, jpeg, png, webp, gif, webm, mp4]
      - name: date
        label: Date
        type: date
      - name: tags
        label: Tags (e.g. 3d, Illustration, Motion, Generative, 2d, Abstract)
        type: string
        list: true
      - name: caption
        label: Caption (optional)
        type: string
      - name: project_url
        label: Project link (optional)
        type: string
      - name: id
        label: Link name (optional — filled from the file name, used in index.html#name)
        type: string
      - name: resolution
        label: Size, e.g. 1080x1920 (optional — filled automatically)
        type: string
      - name: hidden
        label: Hidden (draft)
        type: boolean
        default: false

  - name: cases
    label: Cases
    type: file
    path: data/cases.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle (e.g. "Rebranding")
        type: string
      - name: year
        label: Year
        type: string
      - name: cover
        label: Cover (any size — it is compressed automatically)
        type: image
        options:
          media: cases
          extensions: [jpg, jpeg, png, webp, gif]
      - name: cover_video
        label: Cover video loop (optional, silent, 5–10 s — webm and/or mp4)
        type: file
        options:
          media: cases
          multiple:
            max: 2
          extensions: [webm, mp4]
      - name: film
        label: Full film (optional — adds a "watch film" button; webm and/or mp4)
        type: file
        options:
          media: cases
          multiple:
            max: 2
          extensions: [webm, mp4]
      - name: gallery
        label: Hover frames (2–4 pictures shown on hover)
        type: image
        options:
          media: cases
          multiple:
            max: 6
          extensions: [jpg, jpeg, png, webp, gif]
      - name: tags
        label: Tags
        type: string
        list: true
      - name: url
        label: Link to the case (Behance, hsedesign…)
        type: string
      - name: featured
        label: Big card (full width)
        type: boolean
        default: false
      - name: hidden
        label: Hidden (draft)
        type: boolean
        default: false
