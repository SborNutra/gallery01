name: Optimize Media

# Builds light WebP previews for shards (assets/pics/thumbs) and downloads/compresses
# every case image from data/cases.json into assets/cases, fills empty fields in
# data/shards.json, rebuilds feed.xml and the link previews. Runs by itself on push.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'assets/pics/**'
      - 'assets/cases/**'
      - 'data/cases.json'
      - 'data/shards.json'
      - 'scripts/optimize_media.py'
      - 'js/**'
      - 'css/**'
      - '*.html'
      - '.github/workflows/optimize-media.yml'

permissions:
  contents: write

concurrency:
  group: optimize-media
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Optimize
        run: python scripts/optimize_media.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/pics/thumbs assets/cases assets/og data/cases.json data/shards.json feed.xml *.html

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "chore: optimize media"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
